<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Заголовок страницы -->
  <title>Turtle Translator 🐢</title>
  
  <!-- Название PWA при добавлении на рабочий стол iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Turtle">
  
  <!-- Подключаем стили -->
  <link rel="stylesheet" href="turtle.css">
</head>
<body>

<div class="container">
  
<div class="header">
  <!-- Переключатель языка -->
  <div class="lang-switch">
    <button id="langRu" class="lang-btn">RU</button>
    <button id="langEn" class="lang-btn">EN</button>
  </div>

  <!-- 3D Заголовок -->
  <div class="header-3d">Turtle Translator</div>
</div>

  <!-- Селектор режимов перевода -->
  <div class="mode-selector">
    <button class="btn-mode active" id="btnToTurtle">Человек ➔ Черепаха</button>
    <button class="btn-mode" id="btnFromTurtle">Черепаха ➔ Человек</button>
  </div>

  <!-- Поле ввода -->
  <label id="inputLabel" for="inputText">Введи текст на человеческом:</label>
  <textarea id="inputText" placeholder="Привет..."></textarea>

  <!-- Заголовок результата и кнопка копирования -->
  <div class="output-header">
    <label id="outputLabel">Результат:</label>
    <button id="copyBtn" class="btn-copy">Скопировать</button>
  </div>
  
  <!-- Вывод результата -->
  <div class="output-box" id="outputText">... (тишина)</div>

  <!-- Футер -->
  <div class="footer-info" id="footerText">Словарь сохраняется в память устройства</div>
</div>

<!-- Подключаем скрипт логики -->
<script src="turtle.js"></script>
</body>
</html>
